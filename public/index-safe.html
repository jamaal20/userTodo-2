<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UserTodo — Sign In</title>
  <meta name="description" content="Sign in or create an account to manage your tasks with UserTodo.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self';">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #16213e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      color: #fff;
      text-align: center;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 6px;
      background: #0f3460;
      color: #fff;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #357abd;
    }
    .error {
      color: #ff6b6b;
      margin: 10px 0;
      padding: 10px;
      background: rgba(255,107,107,0.1);
      border-radius: 6px;
    }
    .success {
      color: #51cf66;
      margin: 10px 0;
      padding: 10px;
      background: rgba(81,207,102,0.1);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>UserTodo</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <div id="message"></div>
    </form>
    <p style="text-align: center; margin-top: 20px;">
      Don't have an account? <a href="#" onclick="showRegister()">Register</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      
      if (!username || !password) {
        messageDiv.innerHTML = '<div class="error">Please enter username and password</div>';
        return;
      }
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          localStorage.setItem('token', result.token);
          localStorage.setItem('username', result.username);
          messageDiv.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
          setTimeout(() => {
            window.location.href = '/app.html';
          }, 1000);
        } else {
          messageDiv.innerHTML = '<div class="error">' + (result.error || 'Login failed') + '</div>';
        }
      } catch (error) {
        messageDiv.innerHTML = '<div class="error">Connection error. Please try again.</div>';
      }
    });
    
    function showRegister() {
      alert('Registration page would be here. For now, try username: test, password: test123');
    }
  </script>
</body>
</html>
